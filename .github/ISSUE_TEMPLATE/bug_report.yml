name: Bug Report
description: Report a bug or issue with a mod
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help us understand and fix the issue.
  
  - type: dropdown
    id: mod
    attributes:
      label: Which mod is affected?
      description: Select the mod that has the bug
      options:
        - Simple Voice Chat Group Player Names
      default: 0
    validations:
      required: true
  
  - type: input
    id: mod-version
    attributes:
      label: Mod Version
      description: What version of the mod are you using?
      placeholder: "e.g., 1.0.0"
    validations:
      required: true
  
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft Version
      description: What version of Minecraft are you running?
      placeholder: "e.g., 1.20.1"
    validations:
      required: true
  
  - type: input
    id: mod-loader
    attributes:
      label: Mod Loader
      description: Which mod loader are you using?
      placeholder: "e.g., Forge, Fabric, NeoForge"
    validations:
      required: true
  
  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: Clearly describe what the bug is
      placeholder: Describe the bug you encountered...
    validations:
      required: true
  
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide detailed steps to reproduce the bug
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what you expected to happen...
    validations:
      required: true
  
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what actually happened...
    validations:
      required: true
  
  - type: textarea
    id: logs
    attributes:
      label: Logs and Crash Reports
      description: If applicable, add crash reports or relevant log excerpts
      placeholder: Paste your logs here...
      render: shell
  
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem
      placeholder: Drag and drop images here or paste image URLs...
  
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: Any other information that might be helpful...
