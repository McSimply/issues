name: Mod Idea
description: Suggest a completely new mod concept
title: "[Mod Idea] "
labels: ["mod-idea", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your mod idea! Please provide as much detail as possible to help us understand your vision.
  
  - type: input
    id: mod-name
    attributes:
      label: Proposed Mod Name
      description: What would you call this new mod?
      placeholder: "e.g., Simple Voice Chat Group Player Names 2"
    validations:
      required: true
  
  - type: textarea
    id: mod-concept
    attributes:
      label: Mod Concept
      description: What is the core concept of this mod?
      placeholder: Describe the main idea behind this mod...
    validations:
      required: true
  
  - type: textarea
    id: features
    attributes:
      label: Key Features
      description: What are the main features this mod would include?
      placeholder: |
        - Feature 1
        - Feature 2
        - Feature 3
    validations:
      required: true
  
  - type: textarea
    id: target-audience
    attributes:
      label: Target Audience
      description: Who would benefit from this mod? What use cases would it serve?
      placeholder: Describe who would use this mod and why...
    validations:
      required: true
  
  - type: dropdown
    id: minecraft-version-target
    attributes:
      label: Target Minecraft Version
      description: Which Minecraft version would you like to see this mod for?
      options:
        - 1.20.x (Latest)
        - 1.19.x
        - 1.18.x
        - 1.16.x
        - Other (specify in additional context)
      default: 0
  
  - type: checkboxes
    id: mod-loaders
    attributes:
      label: Preferred Mod Loaders
      description: Which mod loaders should this mod support?
      options:
        - label: Forge
        - label: Fabric
        - label: NeoForge
        - label: No preference
  
  - type: textarea
    id: similar-mods
    attributes:
      label: Similar Mods
      description: Are there any existing mods similar to this idea? How would yours be different?
      placeholder: List any similar mods and explain how this idea differs...
  
  - type: textarea
    id: mockups
    attributes:
      label: Mockups or Examples
      description: If applicable, add mockups, sketches, or examples to illustrate your idea
      placeholder: Drag and drop images here or paste image URLs...
  
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context or details about your mod idea
      placeholder: Any other information that might be helpful...
